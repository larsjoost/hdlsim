name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the previous run obsolete: cancel it
# instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo (clippy)
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Zero-tolerance gate: every lint finding (warning or error) fails the
      # job, so new code cannot reintroduce the 198 findings this pass fixed.
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

  lib-unwrap:
    name: "lib lints: no unguarded unwrap or panic"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo (lib lints)
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The hard line of "no unguarded crashes in library/runtime code":
      # `.unwrap()` never states an invariant, so it is denied in library
      # code, and explicit `panic!` belongs in tests, not the kernel.
      # Where an invariant is statically guaranteed, state it with
      # `.expect("…")`; where a lock may be poisoned, recover with
      # into_inner(). Tests and the CLI entry points are outside this rule.
      - name: Deny unwrap and panic in library code
        run: cargo clippy --workspace --lib -- -D clippy::unwrap_used -D clippy::panic

  standards-audit:
    name: standards audit (ratchet)
    runs-on: ubuntu-latest
    env:
      # Plain cargo output so the ratchet script's `-->` parsing matches:
      # GitHub's default CARGO_TERM_COLOR=always wraps them in ANSI escapes.
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust (stable) with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo (standards audit)
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The ratchet (scripts/standards-baseline.sh): shape debt — functions
      # over the 50-line split line, functions over complexity 30, modules
      # over ~600 lines — is frozen in docs/standards-baseline.json and
      # must never grow. Improvements lower the baseline; raising a number
      # needs review agreement in the PR that edits it.
      - name: Ratchet check (shape debt must not grow)
        run: scripts/standards-baseline.sh --check

      # Stacked changes ("≤ ~400 changed lines each"): one check per commit
      # in the PR. Advisory: numstat double-counts moved lines, so pure
      # moves (verify with git diff --color-moved=dimmed-zebra) trip it;
      # binary files do not count as changed lines.
      - name: Per-commit change sizes (advisory)
        continue-on-error: true
        run: |
          base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          status=0
          for sha in $(git rev-list --no-merges "$base"..HEAD); do
            n="$(git show --numstat --pretty=format: "$sha" | awk 'NF==3 && $1!="-" {a+=$1; d+=$2} END {print a+d+0}')"
            short="$(git log -1 --format='%h %s' "$sha")"
            if [ "$n" -gt 400 ]; then
              echo "::error::commit $short touches $n changed lines (standard: <= ~400): $short"
              status=1
            else
              echo "ok ($n changed lines): $short"
            fi
          done
          exit $status

  test:
    name: build + test (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # Cache the registry and target dir (keyed on Cargo.lock and rustc
      # version): only changed crates recompile between runs.
      - name: Cache cargo (debug)
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The workspace uses only the vetted common crates from
      # [workspace.dependencies]; they are fetched from crates.io here.
      - name: Build (debug)
        run: cargo build

      # The corpus tests compile thousands of third-party sources —
      # minutes in release, hours in debug (the kernel is the hot path).
      # The debug job covers everything else; the corpus job runs the
      # corpus with the release profile and a hard timeout.
      - name: Run tests
        run: cargo test -- --skip corpus

  corpus:
    name: corpus (release)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # Same release cache as the smoke job: the corpus compiles the
      # whole workspace in release anyway.
      - name: Cache cargo (release)
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: v0-rust-release

      - name: Run corpus tests
        run: cargo test --release --test corpus -- --ignored

  release-smoke:
    name: release binary smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # Distinct prefix key so the release target dir is cached separately
      # from the debug one.
      - name: Cache cargo (release)
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: v0-rust-release

      - name: Build release binary and smoke-test it
        run: |
          cargo build --release
          ./target/release/hdlsim --help
          # smoke: simulate the example testbenches (Verilog, VHDL, RV32I cpu)
          ./target/release/hdlsim run --top tb_counter --max-time 1us examples/counter/counter.v examples/counter/tb_counter.v | grep -q PASS
          ./target/release/hdlsim run --top tb_counter --max-time 1us examples/vhdl-counter/counter.vhd examples/vhdl-counter/tb_counter.vhd | grep -q PASS
          ./examples/riscv-vhdl/run_tests.sh ./target/release/hdlsim
          # smoke: NPU example (unit + RV32I cpu integration, multi-library)
          ./examples/npu-vhdl/run_tests.sh ./target/release/hdlsim
          # smoke: fp32 add/mul example
          ./examples/fp-vhdl/run_tests.sh ./target/release/hdlsim
          # smoke: pack the multi-library riscv example into a reproducer bundle
          # and reproduce a run from the bundle alone
          (cd examples/riscv-vhdl && "$PWD/../../target/release/hdlsim" bundle --out /tmp/repro.tar --top tb_alu)
          ./target/release/hdlsim run --bundle /tmp/repro.tar --top tb_alu --max-time 10us | grep -q PASS
