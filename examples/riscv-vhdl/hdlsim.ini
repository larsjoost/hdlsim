# Multi-library layout for the RV32I example:
#   rv32i = the CPU RTL (alu, decode, regfile, imem, dmem, cpu)
#   work  = the testbenches (they instantiate entity rv32i.<unit>)
# Run a testbench from this directory with no file arguments — hdlsim resolves
# the top and all dependencies across both libraries automatically:
#   hdlsim run --top tb_cpu_sum --max-time 10us
[Library]
rv32i = rtl
work = tb
