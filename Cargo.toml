[workspace]
members = ["crates/*"]
resolver = "2"

# Shared package metadata — everything needed for `cargo publish` (crates.io).
[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/larsjoost/hdlsim"
readme = "README.md"
authors = ["Lars Joost Jensen <larsjoostjensen@gmail.com>"]

# Workspace-wide lint baseline; every crate opts in with `[lints]
# workspace = true`. The warn entries are enforced by the CI gate's
# `-D warnings` (all measured zero findings on adoption); `unsafe_code`
# is denied outright. Lints with existing findings stay audit-only —
# see the standards-audit job and AGENTS.md.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"

# Path deps also carry a version so `cargo publish` can rewrite them to
# registry deps in the packaged manifests.
[workspace.dependencies]
hdl-syntax = { path = "crates/hdl-syntax", version = "0.2.0" }
hdl-ir = { path = "crates/hdl-ir", version = "0.2.0" }
hdl-lib = { path = "crates/hdl-lib", version = "0.2.0" }
hdl-sim = { path = "crates/hdl-sim", version = "0.2.0" }
hdl-wave = { path = "crates/hdl-wave", version = "0.2.0" }

# Vetted set of common external crates (see REVIEWING.md). Prefer std when it is
# a reasonable fit; a crate opts in to one of these with `x.workspace = true`.
thiserror = "2"
anyhow = "1"
# default-features off: no ANSI color in clap's own output (the binary has its
# own --color/NO_COLOR handling) and no strsim dependency for suggestions.
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
serde = { version = "1", features = ["derive"] }
# arbitrary_precision keeps number lexemes verbatim (JSON-RPC ids round-trip).
serde_json = { version = "1", features = ["arbitrary_precision"] }
log = "0.4"
# Ctrl-C / SIGTERM handling for the CLI: one handler closure, cross-platform.
# The handler only sets an atomic flag; the kernel dumps the location at a
# safe point (justification for leaving the vetted set in the PR description).
ctrlc = { version = "3", features = ["termination"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
