[package]
name = "hdlsim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/hdlsim"
readme.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "hdlsim — self-contained VHDL + Verilog simulator (CLI binary and library API)"
keywords = ["vhdl", "verilog", "simulator", "hdl", "cli"]
categories = ["simulation", "command-line-utilities"]

[[bin]]
name = "hdlsim"
path = "src/main.rs"

[lib]
name = "hdlsim"
path = "src/lib.rs"

[dependencies]
hdl-syntax.workspace = true
hdl-lib.workspace = true
hdl-ir.workspace = true
hdl-sim.workspace = true
hdl-wave.workspace = true
