[package]
name = "hdl-ir"
version = "0.1.0"
edition = "2021"
description = "Language-neutral elaborated design IR (netlist + processes)"
license = "MIT"

[dependencies]
hdl-syntax = { path = "../hdl-syntax" }
# Note: hdl-ir deliberately does NOT depend on hdl-lib (that would be circular).
# Name resolution is injected via a ResolveCtx trait implemented by hdl-lib users.
